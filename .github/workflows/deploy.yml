name: Deploy Static Website to S3

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::412381747427:role/GitHubActionsS3DeployRole
          aws-region: ap-south-1

      - name: Deploy website to S3
        run: |
          aws s3 sync ./site s3://ishwar-github-aws-portfolio-2026 --delete
